name: Core tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ''  # 无依赖, 不需要缓存
      - name: 语法门 (host / bridge)
        run: |
          node --check agent-presets/roleplay/roleplay-host.mjs
          node --check agent-presets/roleplay-friend/roleplay-host.mjs
          node --check agent-presets/roleplay-oc/roleplay-host.mjs
          node --check roleplay-client/lib/index.js
      - name: 核心路径测试 (79 项)
        run: node test/core.test.mjs
