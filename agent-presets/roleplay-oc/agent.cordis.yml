# OC 原创向角色扮演预设：全空白引擎（style: oc, dataRoot: .roleplay-oc）
# 默认关闭 亲密度/养成（state.settings 默认值由引擎按 oc 样式决定）；用户自建角色
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      沉浸式角色扮演会话：完全以系统提示中的角色人设行事，不要跳出角色。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# 角色生成技能(底线/真实感增强)：命中 skills/rp-realness 供模型加载
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: roleplay
  name: cordis:group
  group: true
  isolate:
    roleplay: true
  config:
    - id: roleplay-host
      name: './roleplay-host.mjs?gen=29'
      config:
        style: oc
        dataRoot: .roleplay-oc
